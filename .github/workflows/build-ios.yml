name: Build AlarmaMy (iOS 26 Unsigned IPA)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode and SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests on iOS Simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available iPhone --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          devices = [d for runtime, ds in data['devices'].items() if 'iOS' in runtime for d in ds if d.get('isAvailable')]
          preferred = [d for d in devices if d['name'] == 'iPhone 15']
          chosen = preferred[0] if preferred else (devices[0] if devices else None)
          print(chosen['udid'] if chosen else '')
          ")
          if [ -z "$SIM_ID" ]; then
            echo "No available iPhone simulator found; skipping simulator tests."
            exit 0
          fi
          echo "Using simulator UDID: $SIM_ID"
          xcodebuild test \
            -project AlarmaMy.xcodeproj \
            -scheme AlarmaMy \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive unsigned Release build for iOS
        run: |
          xcodebuild archive \
            -project AlarmaMy.xcodeproj \
            -scheme AlarmaMy \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/AlarmaMy.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package AlarmaMy-Unsigned.ipa
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/AlarmaMy.xcarchive/Products/Applications/AlarmaMy.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r "AlarmaMy-Unsigned.ipa" Payload
          mkdir -p "${{ github.workspace }}/output"
          mv "AlarmaMy-Unsigned.ipa" "${{ github.workspace }}/output/AlarmaMy-Unsigned.ipa"

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlarmaMy-Unsigned-IPA
          path: ${{ github.workspace }}/output/AlarmaMy-Unsigned.ipa
          retention-days: 30
