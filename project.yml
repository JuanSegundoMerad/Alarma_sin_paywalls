name: AlarmaMy
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1" # iPhone only (iPhone 15)
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AlarmaMy:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
        excludes:
          - "**/.DS_Store"
    info:
      path: Sources/App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.alarmamy
        PRODUCT_NAME: AlarmaMy
        INFOPLIST_FILE: Sources/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  AlarmaMyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/AlarmaMyTests
    dependencies:
      - target: AlarmaMy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.alarmamy.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AlarmaMy.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AlarmaMy"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  AlarmaMy:
    build:
      targets:
        AlarmaMy: all
        AlarmaMyTests: [test]
    test:
      targets:
        - AlarmaMyTests
